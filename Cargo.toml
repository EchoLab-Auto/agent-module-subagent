[workspace]
resolver = "2"
members = ["crates/agent-module-subagent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/EchoLab-Auto/agent-module-subagent"

[workspace.dependencies]
# Core 基础 crate；与 Core 保持同一 main 版本，避免跨版本 trait 不兼容。
echo-defs = { git = "https://github.com/EchoLab-Auto/EchoAgentCore", branch = "main" }
echo-tool = { package = "agent-module-tools", git = "https://github.com/EchoLab-Auto/EchoAgentCore", branch = "main" }
echo-federation = { package = "agent-module-federation", git = "https://github.com/EchoLab-Auto/EchoAgentCore", branch = "main" }
echo-protocol = { git = "https://github.com/EchoLab-Auto/EchoAgentCore", branch = "main" }
# 框架仓（模块 trait / 挂载上下文）。tag 必须与 EchoAgentCore 根 Cargo.toml
# 一致，否则同一进程里会出现两份 `Box<dyn Module>`。
echo-module = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch", tag = "v0.19.4" }
echo-context = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch", tag = "v0.19.4" }

anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
dashmap = "6"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
